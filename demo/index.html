  <body>
    <main id="demo">
      <noscript>
        <h1>Contour</h1>
        <p>
          An FFGL effect that reads the picture's brightness as ground height
          and draws it like a survey map: contour lines at a fixed interval,
          heavier index contours, hill-shading from the north-west, hypsometric
          tints, and a sea the music can raise. Contours crowd together on steep
          ground because their spacing is the slope, and every line stays one
          pen width whether it's on a cliff or a plain.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/contour">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/contour/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/contour/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/contour">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
